name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z); versions and changelog must match
        required: true
        type: string
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve existing release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release requires an existing vX.Y.Z tag."
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}")
          git checkout --detach "$commit"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate manifest versions and extract notes
        id: notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const frontend = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').split(/^\[/m)
            .find(section => section.startsWith('package]'))?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if ([frontend, tauri, cargo].some(value => value !== version)) {
            throw new Error(`Tag ${version} must match package.json (${frontend}), tauri.conf.json (${tauri}) and Cargo.toml (${cargo})`);
          }
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find(part => part.startsWith(`[${version}]`));
          const notes = section?.slice(section.indexOf('\n') + 1).trim();
          if (!notes) throw new Error(`CHANGELOG.md needs nonempty notes for [${version}]`);
          const delimiter = 'RELEASE_NOTES_' + crypto.randomUUID();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${notes}\n${delimiter}\n`);
          NODE
  validate:
    needs: resolve
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
  release:
    needs: [resolve, validate]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -- --locked
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: TCP Streamer ${{ needs.resolve.outputs.tag }}
          releaseBody: ${{ needs.resolve.outputs.body }}
          releaseDraft: true
          prerelease: false
